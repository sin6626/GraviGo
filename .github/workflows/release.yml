name: Draft release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gravigo-release
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=0 "platforms;android-37.0" "build-tools;36.0.0"'
      - name: Build signed APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/.release-signing.jks
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing keystore}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing store password}"
          : "${ANDROID_KEY_ALIAS:?Missing alias}"
          : "${ANDROID_KEY_PASSWORD:?Missing key password}"
          : "${EXPECTED_CERT_SHA256:?Missing expected certificate}"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          (cd android && ./gradlew --no-daemon :app:assembleRelease)
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          actual=$("$apksigner" verify --verbose --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          expected=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test "$actual" = "$expected"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "versionCode='5' versionName='1.0.0'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "package: name='io.github.sin6626.gravigo'"
          mkdir -p release-assets
          cp "$apk" release-assets/GraviGo-1.0.0.apk
      - name: Build Windows gateway
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p gateway-package
          go build -trimpath -ldflags="-s -w -X main.Version=1.0.0" -o gateway-package/gravigo-gateway.exe ./cmd/gateway
          python3 android/scripts/package_gateway.py --binary gateway-package/gravigo-gateway.exe --output release-assets/GraviGo-Gateway-1.0.0-windows-amd64.zip
      - name: Archive matching source
        run: |
          git archive --format=zip --prefix=GraviGo-1.0.0/ --output=release-assets/GraviGo-1.0.0-source.zip "$GITHUB_SHA"
          printf 'Source commit: %s\nSource: https://github.com/%s/tree/%s\nBuild instructions: README.md and android/docs/releasing.md in the source archive.\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA" > release-assets/SOURCE.txt
      - name: Download macOS gateways built by CI
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: gateway-macos-*
          path: release-assets
          merge-multiple: true
      - name: Create draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet refs/tags/v1.0.0; then
            echo 'Tag already exists. Review it before retrying.' >&2
            exit 1
          fi
          (cd release-assets && sha256sum GraviGo-Gateway-1.0.0-darwin-amd64.tar.gz GraviGo-Gateway-1.0.0-darwin-arm64.tar.gz > SHA256SUMS-macos.txt)
          (cd release-assets && sha256sum GraviGo-1.0.0.apk GraviGo-Gateway-1.0.0-windows-amd64.zip GraviGo-Gateway-1.0.0-darwin-amd64.tar.gz GraviGo-Gateway-1.0.0-darwin-arm64.tar.gz GraviGo-1.0.0-source.zip SOURCE.txt SHA256SUMS-macos.txt > SHA256SUMS.txt)
          cp android/docs/releases/1.0.0.md release-assets/notes.md
          printf '\nSource commit: %s\nSource: https://github.com/%s/tree/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> release-assets/notes.md
          gh release create v1.0.0 release-assets/GraviGo-1.0.0.apk release-assets/GraviGo-Gateway-1.0.0-windows-amd64.zip release-assets/GraviGo-Gateway-1.0.0-darwin-amd64.tar.gz release-assets/GraviGo-Gateway-1.0.0-darwin-arm64.tar.gz release-assets/GraviGo-1.0.0-source.zip release-assets/SOURCE.txt release-assets/SHA256SUMS.txt release-assets/SHA256SUMS-macos.txt --draft --target "$GITHUB_SHA" --title 'GraviGo 1.0.0' --notes-file release-assets/notes.md
      - name: Remove signing file
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/.release-signing.jks"
